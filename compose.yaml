name: gamebook-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamebook}
      POSTGRES_USER: ${POSTGRES_USER:-gamebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamebook-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gamebook-postgres-data:/var/lib/postgresql/data
      - ./compose/postgres/init.sql:/docker-entrypoint-initdb.d/01-gamebook-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  authuser:
    build:
      context: ../GameBook.Microservice.AuthUser
      dockerfile: Dockerfile
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://gamebook:gamebook-local@postgres:5432/gamebook?schema=auth}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-gamebook-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gamebook-local-clients}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: "3001"
    ports:
      - "${AUTHUSER_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

  game:
    build:
      context: ../GameBook.Microservice.Game
      dockerfile: Dockerfile
    environment:
      GAME_DATABASE_URL: ${GAME_DATABASE_URL:-postgresql://gamebook:gamebook-local@postgres:5432/gamebook?schema=game}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-gamebook-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gamebook-local-clients}
      AUTHUSER_URL: ${AUTHUSER_URL:-http://authuser:3001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: "3002"
    ports:
      - "${GAME_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      authuser:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../GameBook.Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTHUSER_URL: ${NEXT_PUBLIC_AUTHUSER_URL:-http://localhost:3001}
        NEXT_PUBLIC_GAME_URL: ${NEXT_PUBLIC_GAME_URL:-http://localhost:3002}
    environment:
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      authuser:
        condition: service_healthy
      game:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gamebook-postgres-data:
